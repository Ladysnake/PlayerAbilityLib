plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'io.github.ladysnake.chenille' version '0.18.0'
}

version = project.mod_version
group = project.maven_group

chenille {
    configurePublishing {
        withLadysnakeMaven()
        withCurseforgeRelease()
        withGithubRelease()
        withModrinthRelease()
    }

    configureTestmod {
        withBaseTestRuns()
    }

    license = project.license_header
    javaVersion = 25
}

repositories {
    chenille.repositories.ladysnake()
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    localImplementation "org.ladysnake:elmendorf:${elmendorf_version}"
    api "org.jetbrains:annotations:19.0.0"
}

java {
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register("testmodJar", Jar) {
    archiveBaseName.set('PalTest')
    from(sourceSets.testmod.output) {
        include 'fabric.mod.json'
        expand 'version': project.version
    }
    from(sourceSets.testmod.output) {
        exclude 'fabric.mod.json'
    }
    dependsOn testmodClasses
}

build.dependsOn(testmodJar)
